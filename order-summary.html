<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Order Summary - DelishBite</title>
  <style>
  :root {
    --primary: #d946ef;
    --primary-dark: #a21caf;
    --secondary: #fdf4ff;
    --bg: #fef9ff;
    --text: #2e2e2e;
    --muted: #7e22ce;
    --soft-gray: #999;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }

  header {
    background-color: var(--primary);
    color: white;
    padding: 1rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
  }

  header h1 {
    font-size: 1.6rem;
    font-weight: bold;
    margin: 0;
  }

  header a {
    color: white;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.95rem;
    transition: opacity 0.2s ease;
  }

  header a:hover {
    opacity: 0.85;
  }

  .container {
    max-width: 800px;
    margin: 2rem auto;
    background: white;
    padding: 2rem;
    border-radius: 16px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
  }

  .order-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1rem 0;
    border-bottom: 1px solid #eee;
    font-size: 1.05rem;
  }

  .order-item:last-child {
    border-bottom: none;
  }

  .order-item span:first-child {
    font-weight: 500;
    color: var(--muted);
  }

  .order-item span:last-child {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-weight: bold;
    color: var(--text);
  }

  .order-item button {
    background: none;
    border: none;
    color: #ef4444;
    font-size: 1.2rem;
    cursor: pointer;
    transition: transform 0.2s;
  }

  .order-item button:hover {
    transform: scale(1.2);
  }

  .total {
    text-align: right;
    font-weight: bold;
    font-size: 1.5rem;
    margin-top: 1.5rem;
    color: var(--primary-dark);
  }

  .empty-msg {
    text-align: center;
    font-size: 1.1rem;
    padding: 2rem 0;
    color: var(--soft-gray);
  }

  .proceed-section {
    text-align: center;
    margin-top: 2.5rem;
  }

  .proceed-btn {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: white;
    font-size: 1.2rem;
    font-weight: bold;
    padding: 1rem 2.5rem;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 6px 15px rgba(0, 0, 0, 0.08);
    transition: all 0.3s ease;
  }

  .proceed-btn:hover {
    background: linear-gradient(135deg, #be2ee6, #8618b7);
    transform: translateY(-3px);
  }

  @media (max-width: 600px) {
    header {
      flex-direction: column;
      align-items: flex-start;
      gap: 0.5rem;
    }

    .container {
      margin: 1rem;
      padding: 1.5rem;
    }

    .order-item {
      flex-direction: column;
      align-items: flex-start;
      gap: 0.4rem;
    }

    .order-item span {
      width: 100%;
      text-align: left;
    }

    .order-item button {
      font-size: 1rem;
    }

    .total {
      font-size: 1.3rem;
      text-align: left;
    }

    .proceed-btn {
      width: 100%;
      font-size: 1.1rem;
    }

    header h1 {
      font-size: 1.4rem;
    }

    header a {
      font-size: 0.9rem;
    }
  }
</style>

</head>
<body>

  <header>
    <h1>Order Summary</h1>
    <a href="menu.html">⬅ Back to Menu</a>
  </header>

  <div class="container">
    <div id="orderDetails"></div>
    <div id="emptyMessage" class="empty-msg" style="display: none;">Your cart is empty. Please add items to continue.</div>
    <div class="total" id="totalContainer" style="display: none;">
      Total: ₹<span id="orderTotal">0</span>
    </div>

    <div class="proceed-section">
      <button class="proceed-btn" id="proceedBtn" onclick="proceedOrder()" style="display: none;">
        🛒 Proceed to Checkout
      </button>
    </div>
  </div>

  <script>
    const order = JSON.parse(localStorage.getItem('delishOrder')) || [];
    const cart = JSON.parse(localStorage.getItem('delishCart')) || {};
    const totalSpan = document.getElementById('orderTotal');
    const totalContainer = document.getElementById('totalContainer');
    const orderDetailsDiv = document.getElementById('orderDetails');
    const proceedBtn = document.getElementById('proceedBtn');
    const emptyMessage = document.getElementById('emptyMessage');

    let total = 0;

    if (order.length === 0) {
      emptyMessage.style.display = 'block';
    } else {
      order.forEach((item, index) => {
        const itemEl = document.createElement('div');
        itemEl.className = 'order-item';
        itemEl.innerHTML = `
          <span>${item.name} × ${item.qty}</span>
          <span>₹${item.price * item.qty}</span>
          <button onclick="removeItem(${index})" style="margin-left:10px;color:red;background:none;border:none;font-size:16px;cursor:pointer;">✖</button>
        `;
        total += item.price * item.qty;
        orderDetailsDiv.appendChild(itemEl);
      });

      totalSpan.textContent = total;
      totalContainer.style.display = 'block';
      proceedBtn.style.display = 'inline-block';
    }

    function proceedOrder() {
      window.location.href = "order_checkout.html";
    }

    function removeItem(index) {
      let order = JSON.parse(localStorage.getItem('delishOrder')) || [];
      const removed = order.splice(index, 1)[0];

      // Also update the cart if it exists
      let cart = JSON.parse(localStorage.getItem('delishCart')) || {};
      if (removed && cart[removed.name]) {
        delete cart[removed.name];
        localStorage.setItem('delishCart', JSON.stringify(cart));
      }

      localStorage.setItem('delishOrder', JSON.stringify(order));
      location.reload();
    }
  </script>
</body>
</html>
