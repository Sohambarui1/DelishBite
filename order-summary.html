<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Order Summary - DelishBite</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
  <style>
  :root {
    /* Updated Color Palette to match Menu */
    --primary: #e16bff;       /* Vibrant purple */
    --primary-light: #b388ff; /* Lighter purple */
    --primary-dark: #5c2dba;  /* Darker purple */
    --secondary: #e16bff;     /* Teal accent */
    --accent: #ff6b6b;        /* Coral accent */
    --light: #f8f4ff;        /* Very light purple */
    --dark: #2d3436;         /* Dark gray */
    --text: #4a4a4a;         /* Dark text */
    --text-light: #7e7e7e;   /* Light text */
    --bg: #ffffff;           /* White background */
    --section-bg: #f9f9f9;   /* Light gray background */
    --border: #e0e0e0;       /* Light border color */
    --success: #4CAF50;      /* Green for success */
    --error: #FF5252;        /* Red for errors */
    --shadow: 0 4px 20px rgba(138, 79, 255, 0.15);
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.05);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.1);
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    --gradient: linear-gradient(135deg, var(--primary), var(--primary-dark));
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Poppins', sans-serif;
    background: var(--light);
    color: var(--text);
    line-height: 1.6;
    padding-bottom: 2rem;
  }

  header {
    background: var(--gradient);
    color: white;
    padding: 1.2rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    box-shadow: var(--shadow);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  header h1 {
    font-size: 1.8rem;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.5px;
  }

  header a {
    color: white;
    text-decoration: none;
    font-weight: 500;
    font-size: 1rem;
    transition: var(--transition);
    display: flex;
    align-items: center;
    gap: 0.5rem;
    background: rgba(255, 255, 255, 0.15);
    padding: 0.5rem 1rem;
    border-radius: var(--radius-sm);
  }

  header a:hover {
    background: rgba(255, 255, 255, 0.25);
    transform: translateY(-1px);
  }

  .container {
    max-width: 800px;
    margin: 2rem auto;
    background: var(--bg);
    padding: 2.5rem;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
  }

  .order-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.5rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--border);
  }

  .order-header h2 {
    font-size: 1.5rem;
    font-weight: 600;
    color: var(--primary);
  }

  .item-count {
    background: var(--primary);
    color: white;
    padding: 0.25rem 0.75rem;
    border-radius: 20px;
    font-size: 0.9rem;
    font-weight: 500;
  }

  .order-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.25rem 0;
    border-bottom: 1px solid var(--border);
    transition: var(--transition);
  }

  .order-item:hover {
    background: rgba(225, 107, 255, 0.03);
  }

  .order-item:last-child {
    border-bottom: none;
  }

  .item-info {
    display: flex;
    align-items: center;
    gap: 1rem;
    flex: 1;
    min-width: 0;
  }

  .item-img {
    width: 80px;
    height: 80px;
    border-radius: var(--radius-sm);
    object-fit: cover;
    box-shadow: var(--shadow-sm);
    background-color: var(--section-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-light);
    font-size: 2rem;
    flex-shrink: 0;
  }

  .item-details {
    min-width: 0;
  }

  .item-details h3 {
    font-weight: 500;
    color: var(--text);
    margin-bottom: 0.25rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .item-details p {
    font-size: 0.9rem;
    color: var(--text-light);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .item-price {
    display: flex;
    align-items: center;
    gap: 1rem;
    flex-shrink: 0;
    margin-left: 1rem;
  }

  .price {
    font-weight: 600;
    color: var(--text);
    min-width: 80px;
    text-align: right;
  }

  .item-qty {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .qty-btn {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--primary);
    font-weight: bold;
    cursor: pointer;
    transition: var(--transition);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .qty-btn:hover {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
  }

  .qty-value {
    min-width: 20px;
    text-align: center;
  }

  .remove-btn {
    background: none;
    border: none;
    color: var(--error);
    font-size: 1.5rem;
    cursor: pointer;
    transition: var(--transition);
    margin-left: 0.5rem;
    opacity: 0.7;
    line-height: 1;
    padding: 0.25rem;
  }

  .remove-btn:hover {
    opacity: 1;
    transform: scale(1.1);
  }

  .empty-state {
    text-align: center;
    padding: 3rem 0;
  }

  .empty-icon {
    font-size: 4rem;
    color: var(--text-light);
    margin-bottom: 1.5rem;
    opacity: 0.5;
  }

  .empty-msg {
    font-size: 1.2rem;
    color: var(--text-light);
    margin-bottom: 1.5rem;
  }

  .empty-btn {
    background: var(--primary);
    color: white;
    border: none;
    padding: 0.75rem 2rem;
    border-radius: var(--radius-sm);
    font-weight: 500;
    cursor: pointer;
    transition: var(--transition);
    box-shadow: var(--shadow-sm);
    text-decoration: none;
    display: inline-block;
  }

  .empty-btn:hover {
    background: var(--primary-dark);
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
  }

  .order-summary {
    margin-top: 2rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border);
  }

  .summary-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 0.75rem;
  }

  .summary-label {
    color: var(--text-light);
  }

  .summary-value {
    font-weight: 500;
  }

  .total-row {
    margin-top: 1rem;
    padding-top: 1rem;
    border-top: 1px dashed var(--border);
    font-size: 1.2rem;
  }

  .total-label {
    color: var(--text);
    font-weight: 600;
  }

  .total-value {
    color: var(--primary);
    font-weight: 700;
  }

  .proceed-section {
    margin-top: 2.5rem;
    text-align: center;
  }

  .proceed-btn {
    background: var(--gradient);
    color: white;
    font-size: 1.1rem;
    font-weight: 600;
    padding: 1rem 3rem;
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    box-shadow: var(--shadow-md);
    transition: var(--transition);
    display: inline-flex;
    align-items: center;
    gap: 0.75rem;
    text-decoration: none;
  }

  .proceed-btn:hover {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    transform: translateY(-3px);
    box-shadow: var(--shadow);
  }

  .proceed-btn:active {
    transform: translateY(0);
  }

  .toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    padding: 12px 24px;
    border-radius: var(--radius-sm);
    color: white;
    background-color: var(--dark);
    box-shadow: var(--shadow);
    z-index: 1000;
    opacity: 1;
    transition: opacity 0.5s;
  }
  .toast.success { background-color: var(--success); }
  .toast.error { background-color: var(--error); }
  .toast.fade-out { opacity: 0; }

  @media (max-width: 768px) {
    header {
      padding: 1rem;
    }
    
    .container {
      margin: 1rem;
      padding: 1.5rem;
    }
    
    .order-item {
      flex-direction: column;
      align-items: flex-start;
      gap: 1rem;
      padding: 1.5rem 0;
    }
    
    .item-price {
      width: 100%;
      justify-content: space-between;
      margin-left: 0;
      margin-top: 0.5rem;
    }
    
    .proceed-btn {
      width: 100%;
      justify-content: center;
    }
  }

  @media (max-width: 480px) {
    header h1 {
      font-size: 1.4rem;
    }
    
    .container {
      padding: 1.25rem;
    }
    
    .item-info {
      flex-direction: column;
      align-items: flex-start;
      gap: 0.75rem;
    }
    
    .item-img {
      width: 100%;
      height: auto;
      max-height: 120px;
    }
  }

  /* Animation */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .order-item {
    animation: fadeIn 0.3s ease forwards;
  }

  .order-item:nth-child(1) { animation-delay: 0.1s; }
  .order-item:nth-child(2) { animation-delay: 0.2s; }
  .order-item:nth-child(3) { animation-delay: 0.3s; }
  .order-item:nth-child(4) { animation-delay: 0.4s; }
  .order-item:nth-child(5) { animation-delay: 0.5s; }
</style>
</head>
<body>

  <header>
    <h1>Order Summary</h1>
    <a href="menu.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      Back to Menu
    </a>
  </header>

  <div class="container">
    <div class="order-header">
      <h2>Your Order</h2>
      <span class="item-count" id="itemCount">0 items</span>
    </div>
    
    <div id="orderDetails"></div>
    
    <div id="emptyMessage" class="empty-state" style="display: none;">
      <div class="empty-icon">🛒</div>
      <h3 class="empty-msg">Your cart is empty</h3>
      <p style="color: var(--text-light); margin-bottom: 1.5rem;">Looks like you haven't added anything to your cart yet</p>
      <a href="menu.html" class="empty-btn">Browse Menu</a>
    </div>

    <div class="order-summary" id="orderSummary" style="display: none;">
      <div class="summary-row">
        <span class="summary-label">Subtotal</span>
        <span class="summary-value" id="subtotal">₹0</span>
      </div>
      <div class="summary-row">
        <span class="summary-label">Delivery Fee</span>
        <span class="summary-value">₹49</span>
      </div>
      <div class="summary-row">
        <span class="summary-label">Tax (5%)</span>
        <span class="summary-value" id="tax">₹0</span>
      </div>
      <div class="summary-row total-row">
        <span class="total-label">Total</span>
        <span class="total-value" id="orderTotal">₹0</span>
      </div>
    </div>

    <div class="proceed-section">
      <a href="order_checkout.html" class="proceed-btn" id="proceedBtn" style="display: none;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="10" cy="20.5" r="1"/><circle cx="18" cy="20.5" r="1"/>
          <path d="M2.5 2.5h3l2.7 12.4a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.6l1.6-8.4H7.1"/>
        </svg>
        Proceed to Checkout
      </a>
    </div>
  </div>

<script>

  // Updated food image mappings with proper aspect ratio and higher quality
  const foodImages = {
    'pizza': 'https://images.unsplash.com/photo-1513104890138-7c749659a591?w=300&h=300&fit=crop&auto=format',
    'burger': 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=300&h=300&fit=crop&auto=format',
    'pasta': 'https://images.unsplash.com/photo-1555949258-eb67b1ef0ceb?w=300&h=300&fit=crop&auto=format',
    'salad': 'https://images.unsplash.com/photo-1546793665-c74683f339c1?w=300&h=300&fit=crop&auto=format',
    'sushi': 'https://images.unsplash.com/photo-1611143669185-af224c5e3252?w=300&h=300&fit=crop&auto=format',
    'sandwich': 'https://images.unsplash.com/photo-1528735602780-2552fd46c7af?w=300&h=300&fit=crop&auto=format',
    'taco': 'https://images.unsplash.com/photo-1551504734-5ee1c4a1479b?w=300&h=300&fit=crop&auto=format',
    'burrito': 'https://images.unsplash.com/photo-1511988617509-a57c8a288659?w=300&h=300&fit=crop&auto=format',
    'ramen': 'https://images.unsplash.com/photo-1623341214825-9f4f963727da?w=300&h=300&fit=crop&auto=format',
    'curry': 'https://images.unsplash.com/photo-1585937421612-70a008356fbe?w=300&h=300&fit=crop&auto=format',
    'fried chicken': 'https://images.unsplash.com/photo-1626082927389-6cd097cdc6ec?w=300&h=300&fit=crop&auto=format',
    'steak': 'https://images.unsplash.com/photo-1603360946369-dc9bb6258143?w=300&h=300&fit=crop&auto=format',
    'soup': 'https://images.unsplash.com/photo-1547592180-85f173990554?w=300&h=300&fit=crop&auto=format',
    'ice cream': 'https://images.unsplash.com/photo-1497034825429-c343d7c6a68f?w=300&h=300&fit=crop&auto=format',
    'cake': 'https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=300&h=300&fit=crop&auto=format',
    'biryani': 'https://images.unsplash.com/photo-1701579231305-d84d8af9a3fd?auto=format&fit=crop&q=60',
    'default': 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=300&h=300&fit=crop&auto=format'
  };

  // Updated CSS for perfect image display
  const style = document.createElement('style');
  style.textContent = `
    .item-img-container {
      width: 80px;
      height: 80px;
      border-radius: var(--radius-sm);
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: var(--shadow-sm);
      position: relative;
    }
    .item-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }
    .order-item:hover .item-img {
      transform: scale(1.05);
    }
  `;
  document.head.appendChild(style);


  // Safe localStorage access with fallbacks
  function getLocalStorage(key, fallback = null) {
    try {
      const item = localStorage.getItem(key);
      return item ? JSON.parse(item) : fallback;
    } catch (e) {
      console.error(`Error reading ${key} from localStorage:`, e);
      return fallback;
    }
  }

  function setLocalStorage(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
      return true;
    } catch (e) {
      console.error(`Error writing to ${key} in localStorage:`, e);
      return false;
    }
  }

  // Get user-specific keys with versioning
  function getUserKeys() {
    try {
      const user = getLocalStorage('delishUser', { email: 'guest' });
      const userEmail = user.email;
      return {
        orderKey: `delishOrder_v2_${userEmail}`,
        cartKey: `delishCart_v2_${userEmail}`,
        totalKey: `delishTotal_v2_${userEmail}`,
        menuKey: `delishMenuState_v2_${userEmail}`
      };
    } catch (e) {
      console.error('Error getting user keys:', e);
      return {
        orderKey: 'delishOrder_v2_guest',
        cartKey: 'delishCart_v2_guest',
        totalKey: 'delishTotal_v2_guest',
        menuKey: 'delishMenuState_v2_guest'
      };
    }
  }

  // Modified getFoodImage function to ensure proper image matching
  function getFoodImage(itemName) {
    if (!itemName || typeof itemName !== 'string') return foodImages.default;
    
    const lowerName = itemName.toLowerCase();
    // Check for exact matches first
    if (foodImages[lowerName]) return foodImages[lowerName];
    
    // Then check for partial matches
    for (const [key, value] of Object.entries(foodImages)) {
      if (lowerName.includes(key)) return value;
    }
    
    return foodImages.default;
  }

  // Initialize the summary page
  function initSummaryPage() {
    const { orderKey } = getUserKeys();
    const order = getLocalStorage(orderKey, []);
    const orderDetailsDiv = document.getElementById('orderDetails');
    const proceedBtn = document.getElementById('proceedBtn');
    const emptyMessage = document.getElementById('emptyMessage');
    const orderSummary = document.getElementById('orderSummary');
    const itemCount = document.getElementById('itemCount');
    const subtotalEl = document.getElementById('subtotal');
    const taxEl = document.getElementById('tax');
    const totalEl = document.getElementById('orderTotal');

    let subtotal = 0;
    const taxRate = 0.05;
    const deliveryFee = 49;

    // Clear existing content
    if (orderDetailsDiv) orderDetailsDiv.innerHTML = '';

    if (!order || order.length === 0) {
      if (emptyMessage) emptyMessage.style.display = 'block';
      if (orderSummary) orderSummary.style.display = 'none';
      if (proceedBtn) proceedBtn.style.display = 'none';
      return;
    }

    if (emptyMessage) emptyMessage.style.display = 'none';
    if (orderSummary) orderSummary.style.display = 'block';
    if (proceedBtn) proceedBtn.style.display = 'inline-flex';

    if (itemCount) {
      itemCount.textContent = `${order.length} ${order.length === 1 ? 'item' : 'items'}`;
    }

    order.forEach((item, index) => {
      if (!item || !item.name || !item.price || !item.qty) return;

      const itemEl = document.createElement('div');
      itemEl.className = 'order-item';
      
      const foodImage = getFoodImage(item.name);
      const itemTotal = (item.price * item.qty).toFixed(2);
      
      itemEl.innerHTML = `
        <div class="item-info">
          <div class="item-img-container">
            <img src="${foodImage}" alt="${item.name}" class="item-img" onerror="this.src='${foodImages.default}'">
          </div>
          <div class="item-details">
            <h3>${item.name}</h3>
            <p>${item.category || 'Main Course'}</p>
          </div>
        </div>
        <div class="item-price">
          <div class="item-qty">
            <button class="qty-btn" onclick="updateQuantity(${index}, -1)">-</button>
            <span class="qty-value">${item.qty}</span>
            <button class="qty-btn" onclick="updateQuantity(${index}, 1)">+</button>
          </div>
          <span class="price">₹${itemTotal}</span>
          <button class="remove-btn" onclick="removeItem(${index})" title="Remove item">×</button>
        </div>
      `;
      
      subtotal += item.price * item.qty;
      if (orderDetailsDiv) orderDetailsDiv.appendChild(itemEl);
    });

    const tax = subtotal * taxRate;
    const total = subtotal + tax + deliveryFee;
    
    if (subtotalEl) subtotalEl.textContent = `₹${subtotal.toFixed(2)}`;
    if (taxEl) taxEl.textContent = `₹${tax.toFixed(2)}`;
    if (totalEl) totalEl.textContent = `₹${total.toFixed(2)}`;
  }

  // Update quantity in summary page
  function updateQuantity(index, change) {
    try {
      const { orderKey, cartKey, menuKey } = getUserKeys();
      const order = getLocalStorage(orderKey, []);
      if (!order[index]) return;

      const newQty = order[index].qty + change;
      
      if (newQty < 1) {
        removeItem(index);
        return;
      }
      
      // Update order
      order[index].qty = newQty;
      
      // Update cart and menu state
      const cart = {};
      order.forEach(item => {
        cart[item.name] = { qty: item.qty, price: item.price };
      });
      
      // Update menu state if exists
      const menuState = getLocalStorage(menuKey, {});
      if (menuState[order[index].name]) {
        menuState[order[index].name].qty = newQty;
        setLocalStorage(menuKey, menuState);
      }
      
      setLocalStorage(orderKey, order);
      setLocalStorage(cartKey, cart);
      
      // Show feedback to user
      showToast(`Updated quantity for ${order[index].name} to ${newQty}`, "success");
      
      // Reload to show updated cart
      setTimeout(() => location.reload(), 300);
    } catch (e) {
      console.error("Update quantity error:", e);
      showToast("⚠️ Failed to update quantity. Please try again.", "error");
    }
  }

  // Remove item from summary page
  function removeItem(index) {
  try {
    const { orderKey, cartKey } = getUserKeys();
    const order = getLocalStorage(orderKey, []);
    if (!order[index]) return;

    const removedItem = order.splice(index, 1)[0];
    
    // Update cart
    const cart = {};
    order.forEach(item => {
      cart[item.name] = { qty: item.qty, price: item.price };
    });
    
    // Save changes
    setLocalStorage(orderKey, order);
    setLocalStorage(cartKey, cart);
    
    // Trigger update notification
    localStorage.setItem('cartUpdated', Date.now());
    
    // Show feedback and reload
    showToast(`Removed ${removedItem.name} from your order`, "success");
    setTimeout(() => location.reload(), 300);
  } catch (e) {
    console.error("Remove item error:", e);
    showToast("⚠️ Failed to remove item. Please try again.", "error");
  }
}

  // Show toast notification
  function showToast(message, type = 'success') {
    try {
      // Remove existing toasts
      document.querySelectorAll('.toast').forEach(toast => toast.remove());
      
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.textContent = message;
      document.body.appendChild(toast);
      
      setTimeout(() => {
        toast.classList.add('fade-out');
        setTimeout(() => toast.remove(), 500);
      }, 3000);
    } catch (e) {
      console.error("Toast error:", e);
      alert(message); // Fallback to alert if toast fails
    }
  }
