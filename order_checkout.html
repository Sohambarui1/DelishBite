<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Checkout - DelishBite</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://checkout.razorpay.com/v1/order_checkout.js"></script>
  <style>
  :root {
    /* Updated color palette with better contrast */
    --primary: #e16bff;       /* Vibrant purple */
    --primary-light: #b388ff; /* Lighter purple */
    --primary-dark: #5c2dba;  /* Darker purple */
    --primary-extra-light: #f3e5ff; /* Very light purple */
    --secondary: #4ECDC4;     /* Fresh teal */
    --accent: #ff6b6b;        /* Coral accent */
    --light: #f8f4ff;        /* Very light purple */
    --dark: #2d3436;         /* Dark gray */
    --text: #333333;         /* Dark text */
    --text-light: #666666;   /* Light text */
    --text-lighter: #999999; /* Very light text */
    --bg: #ffffff;           /* White background */
    --section-bg: #f9f9f9;   /* Light gray background */
    --border: #e0e0e0;       /* Light border color */
    --border-light: #eeeeee; /* Lighter border */
    --success: #4CAF50;      /* Green for success */
    --error: #FF5252;        /* Red for errors */
    --warning: #FF9800;      /* Orange for warnings */
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.05);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.1);
    --shadow-lg: 0 8px 24px rgba(0,0,0,0.15);
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    --gradient: linear-gradient(135deg, var(--primary), var(--primary-dark));
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Poppins', sans-serif;
    background: var(--light);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    line-height: 1.6;
  }

 header {
    width: 100%;
    background: var(--gradient); /* Changed to gradient purple */
    color: white; /* Changed to white text */
    padding: 1.2rem 1.5rem;
    text-align: center;
    position: relative;
    box-shadow: var(--shadow-md); /* Increased shadow for depth */
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 10;
  }

  header h1 {
    font-size: 1.5rem;
    margin: 0;
    font-weight: 600;
    color: white; /* Changed to white */
  }

  header a {
    position: absolute;
    left: 1.5rem;
    top: 50%;
    transform: translateY(-50%);
    color: white; /* Changed to white */
    font-size: 1rem;
    text-decoration: none;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    transition: var(--transition);
  }

  header a:hover {
    color: rgba(255, 255, 255, 0.8); /* Lighter white on hover */
    transform: translateY(-50%) translateX(-4px);
  }

  .container {
    width: 100%;
    max-width: 720px;
    margin: 2rem auto;
    padding: 2rem;
    background: var(--bg);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-md);
    position: relative;
    overflow: hidden;
  }

  .container::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 4px;
    height: 100%;
    background: var(--gradient);
  }

  h2 {
    margin-bottom: 1.5rem;
    font-size: 1.3rem;
    color: var(--primary-dark);
    padding-bottom: 0.75rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  h2 i {
    color: var(--primary);
    font-size: 1.1em;
  }

  .section {
    margin-bottom: 2.5rem;
    position: relative;
  }

  .section:not(:last-child)::after {
    content: '';
    position: absolute;
    bottom: -1.25rem;
    left: 0;
    width: 100%;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--border), transparent);
  }

  label {
    display: block;
    margin-bottom: 0.6rem;
    font-weight: 500;
    color: var(--text-light);
    font-size: 0.95rem;
  }

  input,
  select,
  textarea {
    width: 100%;
    padding: 0.9rem 1.2rem;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 0.95rem;
    margin-bottom: 1.2rem;
    transition: var(--transition);
    background: var(--bg);
    color: var(--text);
    font-family: 'Poppins', sans-serif;
  }

  input:focus,
  select:focus,
  textarea:focus {
    border-color: var(--primary);
    outline: none;
    box-shadow: 0 0 0 3px var(--primary-extra-light);
  }

  textarea {
    resize: vertical;
    min-height: 100px;
  }

  .save-address {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-top: -0.6rem;
    margin-bottom: 1.5rem;
    font-size: 0.9rem;
    color: var(--text-light);
  }

  .save-address input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: var(--primary);
    cursor: pointer;
  }

  .save-address label {
    margin-bottom: 0;
    cursor: pointer;
    font-weight: 400;
  }

  .confirm-btn {
    background: var(--gradient);
    color: var(--bg);
    font-size: 1rem;
    font-weight: 600;
    padding: 1.1rem;
    border: none;
    border-radius: var(--radius-sm);
    width: 100%;
    cursor: pointer;
    transition: var(--transition);
    box-shadow: var(--shadow-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
    letter-spacing: 0.5px;
  }

  .confirm-btn:hover {
    background: linear-gradient(135deg, var(--primary-dark), var(--primary));
    transform: translateY(-2px);
    box-shadow: var(--shadow-lg);
  }

  .confirm-btn:active {
    transform: translateY(0);
  }

  .payment-fields {
    display: none;
    margin-top: 1rem;
    animation: fadeIn 0.3s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .payment-method-icon {
    margin-right: 0.75rem;
    color: var(--primary);
  }

  /* Card field styling */
  .card-group {
    display: flex;
    gap: 1rem;
  }

  .card-group > div {
    flex: 1;
  }

  /* Payment method chips */
  .payment-options {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    margin-bottom: 1.5rem;
  }

  .payment-option {
    flex: 1 0 calc(50% - 0.75rem);
    min-width: 120px;
    padding: 0.75rem 1rem;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    cursor: pointer;
    transition: var(--transition);
    background: var(--bg);
  }

  .payment-option:hover {
    border-color: var(--primary-light);
    background: var(--primary-extra-light);
  }

  .payment-option.active {
    border-color: var(--primary);
    background: var(--primary-extra-light);
    box-shadow: 0 0 0 1px var(--primary);
  }

  .payment-option i {
    margin-right: 0.75rem;
    color: var(--primary);
    font-size: 1.2rem;
  }

  /* Order summary section */
  .order-summary {
    background: var(--section-bg);
    border-radius: var(--radius-sm);
    padding: 1.5rem;
    margin-bottom: 2rem;
  }

  .order-summary h3 {
    margin-bottom: 1rem;
    color: var(--primary-dark);
    font-size: 1.1rem;
    font-weight: 600;
  }

  .summary-item {
    display: flex;
    justify-content: space-between;
    margin-bottom: 0.75rem;
    color: var(--text-light);
    font-size: 0.95rem;
  }

  .summary-total {
    font-weight: 600;
    color: var(--text);
    margin-top: 1rem;
    padding-top: 1rem;
    border-top: 1px dashed var(--border);
    font-size: 1.1rem;
  }

  /* Floating labels effect */
  .input-group {
    position: relative;
    margin-bottom: 1.5rem;
  }

  .input-group label {
    position: absolute;
    top: 0.9rem;
    left: 1.2rem;
    color: var(--text-light);
    transition: var(--transition);
    pointer-events: none;
    background: var(--bg);
    padding: 0 0.5rem;
  }

  .input-group input:focus + label,
  .input-group input:not(:placeholder-shown) + label,
  .input-group textarea:focus + label,
  .input-group textarea:not(:placeholder-shown) + label {
    top: -0.6rem;
    left: 0.8rem;
    font-size: 0.75rem;
    color: var(--primary);
  }

  .input-group input,
  .input-group textarea {
    padding-top: 1.2rem;
    padding-bottom: 0.6rem;
  }

  /* Select dropdown styling */
  select {
    appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238a2be2' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: right 1rem center;
    background-size: 1em;
  }

  /* Responsive */
  @media (max-width: 768px) {
    header {
      padding: 1rem;
    }

    header h1 {
      font-size: 1.3rem;
    }

    .container {
      margin: 1.5rem 1rem;
      padding: 1.5rem;
      border-radius: var(--radius-md);
    }

    h2 {
      font-size: 1.2rem;
    }

    .card-group {
      flex-direction: column;
      gap: 0;
    }
  }

  @media (max-width: 480px) {
    input,
    select,
    textarea {
      padding: 0.8rem 1rem;
      font-size: 0.9rem;
    }

    .confirm-btn {
      padding: 1rem;
      font-size: 0.95rem;
    }

    .container {
      padding: 1.25rem;
    }

    .payment-option {
      flex: 1 0 100%;
    }
  }

  /* Notification styles */
  .checkout-notification {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    padding: 12px 24px;
    border-radius: var(--radius-sm);
    color: white;
    box-shadow: var(--shadow-lg);
    z-index: 1000;
    display: flex;
    align-items: center;
    gap: 10px;
    animation: fadeIn 0.3s ease-out;
  }
  .checkout-notification.error { background-color: var(--error); }
  .checkout-notification.warning { background-color: var(--warning); }
  .checkout-notification.success { background-color: var(--success); }
  .checkout-notification.fade-out {
    animation: fadeOut 0.3s ease-out forwards;
  }
  @keyframes fadeOut {
    to { opacity: 0; transform: translate(-50%, -20px); }
  }

  .order-success-animation {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(255, 255, 255, 0.9);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 1001;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }

  .order-success-animation.active {
    opacity: 1;
    pointer-events: all;
  }

  .success-checkmark {
    width: 80px;
    height: 80px;
    margin: 0 auto;
    position: relative;
  }

  .success-checkmark .check-icon {
    width: 80px;
    height: 80px;
    position: relative;
    border-radius: 50%;
    box-sizing: content-box;
    border: 4px solid var(--success);
  }

  .success-checkmark .check-icon::before {
    top: 3px;
    left: -2px;
    width: 30px;
    transform-origin: 100% 50%;
    border-radius: 100px 0 0 100px;
  }

  .success-checkmark .check-icon::after {
    top: 0;
    left: 30px;
    width: 60px;
    transform-origin: 0 50%;
    border-radius: 0 100px 100px 0;
    animation: rotate-circle 4.25s ease-in;
  }

  .success-checkmark .check-icon::before,
  .success-checkmark .check-icon::after {
    content: '';
    height: 100px;
    position: absolute;
    background: var(--bg);
    transform: rotate(-45deg);
  }

  .success-checkmark .check-icon .icon-line {
    height: 5px;
    background-color: var(--success);
    display: block;
    border-radius: 2px;
    position: absolute;
    z-index: 10;
  }

  .success-checkmark .check-icon .icon-line.line-tip {
    top: 46px;
    left: 14px;
    width: 25px;
    transform: rotate(45deg);
    animation: icon-line-tip 0.75s;
  }

  .success-checkmark .check-icon .icon-line.line-long {
    top: 38px;
    right: 8px;
    width: 47px;
    transform: rotate(-45deg);
    animation: icon-line-long 0.75s;
  }

  .success-checkmark .icon-fix {
    top: 8px;
    width: 5px;
    left: 26px;
    position: absolute;
    height: 85px;
    background-color: var(--bg);
    transform: rotate(-45deg);
  }

  @keyframes icon-line-tip {
    0% { width: 0; left: 1px; top: 19px; }
    54% { width: 0; left: 1px; top: 19px; }
    70% { width: 50px; left: -8px; top: 37px; }
    84% { width: 17px; left: 21px; top: 48px; }
    100% { width: 25px; left: 14px; top: 46px; }
  }

  @keyframes icon-line-long {
    0% { width: 0; right: 46px; top: 54px; }
    65% { width: 0; right: 46px; top: 54px; }
    84% { width: 55px; right: 0px; top: 35px; }
    100% { width: 47px; right: 8px; top: 38px; }
  }

  .success-message {
    text-align: center;
    margin-top: 2rem;
    color: var(--primary-dark);
    font-size: 1.5rem;
    font-weight: 600;
  }

  .success-submessage {
    text-align: center;
    margin-top: 1rem;
    color: var(--text-light);
    font-size: 1rem;
  }

  
</style>
</head>
<body>

  <header>
  <a href="order-summary.html"><i class="fas fa-chevron-left"></i> Back to Summary</a>
  <h1>Complete Your Order</h1>
</header>

  <div class="container">
    <div class="section">
      <h2><i class="fas fa-map-marker-alt"></i> Delivery Details</h2>

      <div class="input-group">
        <input type="text" id="name" placeholder=" " required>
        <label for="name">Full Name</label>
      </div>

      <div class="input-group">
        <input type="tel" id="phone" placeholder=" " required>

        <label for="saveAddress">Save this address for future orders</label>

    </div>

    <div class="order-summary">
      <h3>Order Summary</h3>
      <div class="summary-item">
        <span>Subtotal</span>
        <span id="subtotal">₹0.00</span>
      </div>
      <div class="summary-item">
        <span>Delivery Fee</span>
        <span>₹49.00</span>

      <div class="summary-item">
        <span>Taxes (5%)</span>

      <h2><i class="fas fa-credit-card"></i> Payment Method</h2>

        <div class="payment-option" onclick="selectPayment('card')">

        </div>
        <div class="payment-option" onclick="selectPayment('netbanking')">

      <input type="hidden" id="payment" required>

      <!-- UPI Fields -->
      <div class="payment-fields" id="upiFields">

        <p style="font-size: 0.8rem; color: var(--text-light); margin-top: -0.5rem; margin-bottom: 1rem;">

        </p>

      <!-- Card Fields -->
      <div class="payment-fields" id="cardFields">

          <input type="text" id="cardNumber" placeholder=" " maxlength="16">
          <label for="cardNumber">Card Number</label>
        </div>
        
        <div class="card-group">
          <div class="input-group">
            <input type="text" id="cardName" placeholder=" ">

      <!-- Net Banking -->
      <div class="payment-fields" id="netbankingFields">
        <div class="input-group">
          <select id="bankSelect" required>
            <option value="" selected disabled></option>
            <option value="sbi">State Bank of India</option>

        </div>

    <!-- Order Success Animation -->
<div class="order-success-animation" id="orderSuccessAnimation">
  <div class="success-checkmark">
    <div class="check-icon">
      <span class="icon-line line-tip"></span>
      <span class="icon-line line-long"></span>
      <div class="icon-circle"></div>
      <div class="icon-fix"></div>
    </div>
  </div>
  <div class="success-message">Order Placed Successfully!</div>
  <div class="success-submessage">Redirecting to menu...</div>
</div>

    <button class="confirm-btn" onclick="confirmOrder()">
      <i class="fas fa-lock"></i> Confirm & Pay
    </button>
  </div>

  <script>
  // Enhanced checkout script with proper order total calculation

  // Safe localStorage access with fallbacks
  function getLocalStorage(key, fallback = null) {
    try {
        const item = localStorage.getItem(key);
        return item ? JSON.parse(item) : fallback;
    } catch (e) {
        console.error(`Error reading ${key} from localStorage:`, e);
        return fallback;
    }
}

function setLocalStorage(key, value) {
    try {
        localStorage.setItem(key, JSON.stringify(value));
        return true;
    } catch (e) {
        console.error(`Error writing to ${key} in localStorage:`, e);
        return false;
    }
}

  // Calculate order totals from cart/order data
  function calculateOrderTotals() {
    try {
      const user = getLocalStorage("delishUser", { email: 'guest' });
      const userId = user.email || 'guest';
      const orderKey = `delishOrder_v2_${userId}`;
      const cartKey = `delishCart_v2_${userId}`;
      const totalKey = `delishTotal_v2_${userId}`;
      
      let subtotal = 0;
      const deliveryFee = 49;
      const taxRate = 0.05;
      
      // Try to get from order first
      const order = getLocalStorage(orderKey, []);
      order.forEach(item => {
        subtotal += (item.price || 0) * (item.qty || 0);
      });
      
      // Fallback to cart if order is empty
      if (subtotal === 0) {
        const cart = getLocalStorage(cartKey, {});
        Object.values(cart).forEach(item => {
          subtotal += (item.price || 0) * (item.qty || 0);
        });
      }
      
      // Final fallback to stored total
      if (subtotal === 0) {
        subtotal = parseFloat(getLocalStorage(totalKey, '0')) || 0;
      }
      
      const tax = subtotal * taxRate;
      const total = subtotal + deliveryFee + tax;
      
      return {
        subtotal: Math.max(0, subtotal),
        deliveryFee,
        tax: Math.max(0, tax),
        total: Math.max(0, total)
      };
    } catch (e) {
      console.error("Order calculation error:", e);
      return {
        subtotal: 0,
        deliveryFee: 49,
        tax: 0,
        total: 49
      };
    }
  }

  // Update order summary display
  function updateOrderSummary() {
    try {
      const { subtotal, deliveryFee, tax, total } = calculateOrderTotals();
      
      document.getElementById('subtotal').textContent = `₹${subtotal.toFixed(2)}`;
      document.getElementById('tax').textContent = `₹${tax.toFixed(2)}`;
      document.getElementById('total').textContent = `₹${total.toFixed(2)}`;
    } catch (e) {
      console.error("Order summary update failed:", e);
    }
  }

  // Load saved data on page load
  document.addEventListener('DOMContentLoaded', () => {
    try {
      // Load saved address if available
      const savedAddress = getLocalStorage("delishAddress");
      if (savedAddress) {
        document.getElementById("name").value = savedAddress.name || "";
        document.getElementById("phone").value = savedAddress.phone || "";
        document.getElementById("address").value = savedAddress.address || "";
        document.getElementById("saveAddress").checked = true;
      }
      
      // Update order summary
      updateOrderSummary();
      
      // Initialize payment method selection
      selectPayment('');
      
    } catch (error) {
      console.error("Checkout initialization failed:", error);
      showNotification("Failed to load checkout data. Please refresh the page.", "error");
    }
  });

  // Address validation
  function validateAddress() {
    try {
      const name = document.getElementById('name').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const address = document.getElementById('address').value.trim();
      
      if (name.length < 2) {
        showNotification("Please enter a valid name (at least 2 characters)", "error");
        return false;
      }
      
      if (!/^\d{10}$/.test(phone)) {
        showNotification("Please enter a valid 10-digit phone number", "error");
        return false;
      }
      
      if (address.length < 10) {
        showNotification("Please enter a complete delivery address (at least 10 characters)", "error");
        return false;
      }
      
      return true;
    } catch (e) {
      console.error("Address validation error:", e);
      showNotification("Validation error. Please check your details.", "error");
      return false;
    }
  }

  // Payment validation
  function validatePayment() {
    try {
      const paymentMethod = document.getElementById('payment').value;
      
      if (!paymentMethod) {
        showNotification("Please select a payment method", "error");
        return false;
      }
      
      if (paymentMethod === 'upi') {
        const upiId = document.getElementById('upiId').value.trim();
        if (!/^[\w.-]+@[\w]+$/.test(upiId)) {
          showNotification("Please enter a valid UPI ID (e.g. name@upi)", "error");
          return false;
        }
      }
      
      if (paymentMethod === 'card') {
        const cardNum = document.getElementById('cardNumber').value.trim().replace(/\s/g, '');
        if (!/^\d{16}$/.test(cardNum)) {
          showNotification("Please enter a valid 16-digit card number", "error");
          return false;
        }
        
        const expiry = document.getElementById('expiry').value.trim();
        if (!/^\d{2}\/\d{2}$/.test(expiry)) {
          showNotification("Please enter expiry date in MM/YY format", "error");
          return false;
        }
        
        const cvv = document.getElementById('cvv').value.trim();
        if (!/^\d{3,4}$/.test(cvv)) {
          showNotification("Please enter a valid CVV (3 or 4 digits)", "error");
          return false;
        }
      }
      
      return true;
    } catch (e) {
      console.error("Payment validation error:", e);
      showNotification("Payment validation failed. Please check your details.", "error");
      return false;
    }
  }

  // Payment selection
  function selectPayment(method) {
    try {
      // Update active state
      document.querySelectorAll('.payment-option').forEach(option => {
        option.classList.remove('active');
      });
      
      // Set active state for selected method
      document.querySelectorAll(`.payment-option[onclick*="${method}"]`).forEach(option => {
        option.classList.add('active');
      });
      
      // Set hidden input value
      document.getElementById('payment').value = method;
      
      // Show relevant fields
      document.querySelectorAll('.payment-fields').forEach(el => {
        el.style.display = "none";
      });
      
      if (method && document.getElementById(`${method}Fields`)) {
        document.getElementById(`${method}Fields`).style.display = 'block';
      }
    } catch (e) {
      console.error("Payment selection error:", e);
    }
  }
  async function confirmOrder() {
  try {
    if (!validateAddress() || !validatePayment()) return;

    const name = document.getElementById('name').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const address = document.getElementById('address').value.trim();
    const payment = document.getElementById('payment').value;
    const save = document.getElementById('saveAddress').checked;

    const { subtotal, deliveryFee, tax, total } = calculateOrderTotals();
    
    if (save) {
      setLocalStorage("delishAddress", { name, phone, address });
    }

    const user = getLocalStorage("delishUser", { email: 'guest_' + Date.now().toString(36).slice(-8) });
    const userId = user.id || 'guest';
    const cartKey = `delishCart_v2_${user.email}`;
    const cartItems = Object.values(getLocalStorage(cartKey, {}));

    if (cartItems.length === 0) {
      showNotification("Your cart is empty", "error");
      return;
    }

    const orderData = {
    userId: user.id,
    items: cartItems,
    total: total,
    deliveryAddress: document.getElementById('address').value.trim(), // Make sure this matches your form field
    paymentMethod: document.getElementById('payment').value // Make sure this matches your payment selection
  };

  console.log("Submitting order data:", orderData); // Debug log

  const response = await fetch('http://localhost:3000/order', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(orderData)
  });

    if (!response.ok) {
      throw new Error('Failed to save order to server');
    }

    // Save to local history as fallback
    const savedOrder = saveOrderToHistory(orderData);
    
    // Clear cart
    localStorage.removeItem(cartKey);
    localStorage.removeItem(`delishTotal_v2_${user.email}`);
    
    // Show success
    document.getElementById('orderSuccessAnimation').classList.add('active');
    
    setTimeout(() => {
      window.location.href = `menu.html?orderId=${savedOrder.orderId}`;
    }, 3000);
    
  } catch (error) {
    console.error("Order confirmation failed:", error);
    showNotification("Failed to process your order. Please try again.", "error");
  }
}

// Keep only one version of saveOrderToHistory (remove any duplicates)
function saveOrderToHistory(orderDetails) {
    try {
        // Get or create user account
        let user = getLocalStorage("delishUser");
        
        // If no user exists (guest checkout), create a temporary guest user
        if (!user) {
            user = {
                email: 'guest_' + Date.now().toString(36).slice(-8),
                name: 'Guest Customer',
                guest: true
            };
            setLocalStorage("delishUser", user);
        }

        // Validate required order details
        if (!orderDetails) {
            throw new Error('No order details provided');
        }

        // Validate items array
        if (!Array.isArray(orderDetails.items) || orderDetails.items.length === 0) {
            throw new Error('Order must contain at least one item');
        }

        // Create complete order object
        const order = {
            orderId: 'DB-' + Date.now().toString().slice(-6) + Math.floor(Math.random() * 90 + 10),
            orderDate: new Date().toISOString(),
            status: orderDetails.paymentMethod === 'cod' ? 'Processing' : 'Paid',
            items: orderDetails.items.map(item => ({
                id: item.id || 'item_' + Math.random().toString(36).substring(2, 8),
                name: item.name || 'Unnamed Item',
                price: parseFloat(item.price) || 0,
                quantity: parseInt(item.quantity) || 1,
                image: item.image || 'https://via.placeholder.com/70?text=Food',
                notes: item.notes || ''
            })),
            subtotal: parseFloat(orderDetails.subtotal || 0),
            deliveryFee: parseFloat(orderDetails.deliveryFee || 0),
            discount: parseFloat(orderDetails.discount || 0),
            tax: parseFloat(orderDetails.tax || 0),
            total: parseFloat(orderDetails.total || 0),
            deliveryAddress: typeof orderDetails.deliveryAddress === 'string' ? 
                orderDetails.deliveryAddress : 
                JSON.stringify(orderDetails.deliveryAddress),
            paymentMethod: orderDetails.paymentMethod || 'Not specified'
        };

        // Get existing orders or initialize new array
        const orderHistoryKey = `delishOrderHistory_${user.email}`;
        const existingOrders = getLocalStorage(orderHistoryKey, []);
        
        // Add new order to beginning of array (most recent first)
        const updatedOrders = [order, ...existingOrders];
        
        // Save to localStorage
        setLocalStorage(orderHistoryKey, updatedOrders);
        
        console.log('Order saved successfully:', order);
        return order;
        
    } catch (error) {
        console.error('Failed to save order:', error);
        showNotification('Failed to save your order. Please contact support if this persists.', 'error');
        return null;
    }
}

  // Notification system
  function showNotification(message, type = "success") {
    try {
      // Remove existing notifications
      document.querySelectorAll('.checkout-notification').forEach(el => el.remove());
      
      // Create new notification
      const notification = document.createElement('div');
      notification.className = `checkout-notification ${type}`;
      
      // Set icon based on type
      let icon;
      switch(type) {
        case "error": icon = "fa-exclamation-circle"; break;
        case "warning": icon = "fa-exclamation-triangle"; break;
        default: icon = "fa-check-circle";
      }
      
      notification.innerHTML = `
        <i class="fas ${icon}"></i>
        <span>${message}</span>
      `;
      
      document.body.appendChild(notification);
      
      // Auto-dismiss after 3 seconds
      setTimeout(() => {
        notification.classList.add('fade-out');
        setTimeout(() => notification.remove(), 300);
      }, 3000);
    } catch (e) {
      console.error("Notification error:", e);
      alert(message); // Fallback
    }
  }

  // Format card number input
  document.getElementById('cardNumber')?.addEventListener('input', function(e) {
    this.value = this.value.replace(/\D/g, '').replace(/(\d{4})(?=\d)/g, '$1 ');
  });

  // Format expiry date input
  document.getElementById('expiry')?.addEventListener('input', function(e) {
